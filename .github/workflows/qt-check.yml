name: Probar interfaz Qt

on:
  push:
    branches: [qt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-noto fonts-dejavu-core
          pip install PySide6-Essentials psutil qrcode
      - name: Capturas (claro y oscuro)
        run: |
          mkdir -p out
          HELLOP_MODE=claro OUT=out python qt_shots.py 2>&1 | tail -60 | tee out/log_claro.txt
          HELLOP_MODE=oscuro OUT=out ESPERA=0.6 python qt_shots.py 2>&1 | tail -60 | tee out/log_oscuro.txt
        continue-on-error: true
      - name: Publicar capturas en la rama shots
        run: |
          cd out
          git init -q -b shots
          git config user.email "ci@hellop"
          git config user.name "ci"
          git add -A
          git commit -qm "capturas ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" shots
