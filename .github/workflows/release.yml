name: Publicar version

on:
  push:
    branches: [main]
    paths: ["version.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la version de version.py
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "v=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar el exe
        run: python -m PyInstaller --noconsole --onefile --uac-admin --name HellOP --icon assets/hellop.ico main.py

      - name: Empaquetar codigo y calcular huellas SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path *.py, requirements.txt -DestinationPath dist/HellOP-src.zip -Force
          Copy-Item dist/HellOP.exe dist/PCOptimizer.exe
          Copy-Item dist/HellOP-src.zip dist/PCOptimizer-src.zip
          foreach ($f in "HellOP.exe", "HellOP-src.zip", "PCOptimizer.exe", "PCOptimizer-src.zip") {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "dist/$f.sha256"
          }

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: v${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/HellOP.exe
            dist/HellOP.exe.sha256
            dist/HellOP-src.zip
            dist/HellOP-src.zip.sha256
            dist/PCOptimizer.exe
            dist/PCOptimizer.exe.sha256
            dist/PCOptimizer-src.zip
            dist/PCOptimizer-src.zip.sha256
