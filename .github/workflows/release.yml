name: Publicar version

on:
  push:
    branches: [main]
    paths: ["version.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la version de version.py
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "v=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar el exe
        run: python -m PyInstaller --noconsole --onefile --uac-admin --name HellOP --icon assets/hellop.ico main.py

      - name: Calcular huellas SHA256 (el codigo fuente NO se publica)
        shell: pwsh
        run: |
          Copy-Item dist/HellOP.exe dist/PCOptimizer.exe
          foreach ($f in "HellOP.exe", "PCOptimizer.exe") {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "dist/$f.sha256"
          }

      - name: Comprobar que existe el permiso para publicar
        shell: pwsh
        env:
          T: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if (-not $env:T) { Write-Error "Falta el secreto PUBLIC_REPO_TOKEN (Settings > Secrets and variables > Actions)."; exit 1 }

      - name: Publicar la release en el repositorio PUBLICO (solo el exe)
        uses: softprops/action-gh-release@v2
        with:
          repository: pavos4761-creator/PCOptimizer
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.v }}
          name: v${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/HellOP.exe
            dist/HellOP.exe.sha256
            dist/PCOptimizer.exe
            dist/PCOptimizer.exe.sha256
