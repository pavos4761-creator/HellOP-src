name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que la etiqueta coincide con version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { Write-Error "La etiqueta ($tag) no coincide con version.py ($v)"; exit 1 }

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar el .exe
        run: python -m PyInstaller --noconsole --onefile --uac-admin --name PCOptimizer main.py

      - name: Empaquetar código y calcular huellas SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path *.py, requirements.txt -DestinationPath dist/PCOptimizer-src.zip -Force
          foreach ($f in "PCOptimizer.exe", "PCOptimizer-src.zip") {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "dist/$f.sha256"
          }

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/PCOptimizer.exe
            dist/PCOptimizer.exe.sha256
            dist/PCOptimizer-src.zip
            dist/PCOptimizer-src.zip.sha256
